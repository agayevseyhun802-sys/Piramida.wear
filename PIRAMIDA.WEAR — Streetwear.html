const pyr=(c="#F3EBDD",a="#C4572E")=>`<svg viewBox="0 0 100 90" aria-hidden="true"><path d="M50 4 96 86H4z" fill="${c}"/><path d="M50 4v82L96 86z" fill="${a}" opacity=".85"/></svg>`;
const art=(p,c)=>p.img?`<div class="art" style="background:${p.bg}"><img src="${p.img}" alt="${esc(p.alt||p.n)}" loading="lazy" decoding="async"></div>`:`<div class="art" style="background:${p.bg}">${pyr(c||"#F3EBDD",p.bg==="#C4572E"?"#1E1C1A":"#C4572E")}</div>`;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)};
const card=p=>`<a class="pc rv" href="#product-${p.id}"><span class="tag">DEMO</span>${art(p)}<div class="nm">${esc(p.n)}</div><div class="pr">${money(p)}</div></a>`.replace('<span class="tag">DEMO</span>',CONFIG.SHOW_DEMO_DATA&&!p.real?'<span class="tag">DEMO</span>':"")+"";
const cardW=p=>`<div style="position:relative">${card(p)}<button class="wl" data-act="fav" data-id="${p.id}" aria-pressed="${wish.includes(p.id)}" aria-label="Sevimlilərə əlavə et: ${esc(p.n)}">${wish.includes(p.id)?"♥":"♡"}</button></div>`;
const NAV=[["home","Ana səhifə"],["shop","Mağaza"],["collections","Kolleksiyalar"],["lookbook","Lookbook"],["about","Haqqımızda"],["contact","Əlaqə"]];
const FOOT=[...NAV.slice(1),["size","Ölçü cədvəli"],["shipping","Çatdırılma və Qaytarma"],["cart","Səbət"]];
function chrome(r){
 $("#nav").innerHTML=NAV.map(([k,t])=>`<a href="#${k}" ${r===k?'aria-current="page"':""}>${t}</a>`).join("");
 $("#menu").innerHTML=`<button class="ib" data-act="menu" style="position:absolute;top:14px;right:14px;color:var(--bg)">BAĞLA</button>`+NAV.map(([k,t])=>`<a href="#${k}">${t}</a>`).join("");
 $("#fl").innerHTML=FOOT.map(([k,t])=>`<a href="#${k}">${t}</a>`).join("")+(CONFIG.INSTAGRAM?`<a href="https://instagram.com/${CONFIG.INSTAGRAM}" rel="noopener" target="_blank">Instagram: @${esc(CONFIG.INSTAGRAM)}</a>`:"");
 $("#demob").hidden=!CONFIG.SHOW_DEMO_DATA;$("#demob").textContent="DEMO REJİMİ — məhsullar və qiymətlər nümunədir, real deyil";
 $("#cb").textContent=cart.reduce((s,i)=>s+i.q,0)||"";$("#wb").textContent=wish.length||"";
 $("#cb").hidden=!$("#cb").textContent;$("#wb").hidden=!$("#wb").textContent;
}
/* ============ SƏHİFƏLƏR ============ */
const tpl={
home:()=>`<section class="hero wrap"><svg class="bg" data-par viewBox="0 0 100 90" aria-hidden="true"><path d="M50 4 96 86H4z" fill="var(--bei)"/><path d="M50 4v82L96 86z" fill="var(--ter)"/></svg><span class="eb rv">Yeni mövsüm · Naxışlı siluet</span><h1 class="rv">PİRAMİDA<br><em>geyim.</em></h1><p class="rv" style="max-width:420px">Həndəsi xətlər, kremdən terrakotaya palitra. Sakit lüks, küçə ruhu.</p><div class="rv"><a class="btn mag" href="#shop">Mağazaya bax</a> <a class="btn o mag" href="#lookbook">Lookbook</a></div></section>
<div class="mq" aria-hidden="true"><div>${"PIRAMIDA.WEAR ▲ STREETWEAR ▲ HƏNDƏSİ ▲ ".repeat(8)}</div></div>
<section class="wrap"><span class="eb">Seçilmişlər</span><h2 class="rv" style="margin:8px 0 28px">Əsas parçalar</h2><div class="grid">${DATA.products.slice(0,4).map(cardW).join("")}</div></section>
<section class="wrap two"><div class="rv"><span class="eb">Kolleksiyalar</span><h2>Siluet və xətt</h2></div><div class="rv"><p>Hər kolleksiya bir həndəsi ideyadan doğur. Kolleksiyaları kəşf et.</p><br><a class="btn mag" href="#collections">Kolleksiyalar</a></div></section>`,
shop:()=>{const cats=["Hamısı",...new Set(DATA.products.map(p=>p.cat))],cols=["Hamısı",...new Set(DATA.products.flatMap(p=>p.colors.map(c=>c[0])))];
 return `<section class="wrap"><h2>Mağaza</h2><label for="q" class="eb">Axtarış</label><input id="q" type="search" placeholder="Məhsul axtar…" value="${esc(F.q)}"><div class="chips" role="group" aria-label="Kateqoriya">${cats.map(c=>`<button class="chip" data-act="fcat" data-v="${c}" aria-pressed="${F.cat===c}">${c}</button>`).join("")}</div><div class="chips" role="group" aria-label="Rəng">${cols.map(c=>`<button class="chip" data-act="fcol" data-v="${c}" aria-pressed="${F.color===c}">${c}</button>`).join("")}<button class="chip" data-act="fwl" aria-pressed="${F.wo}">Yalnız sevimlilər</button></div><p id="cnt" aria-live="polite"></p><div class="grid" id="pl"></div></section>`},
collections:()=>`<section class="wrap"><h2>Kolleksiyalar</h2><div class="grid g3" style="margin-top:28px">${DATA.collections.map(c=>{const ps=DATA.products.filter(p=>p.col===c.id);return `<a class="pc rv" href="#shop" data-act="setcol" data-id="${c.id}"><div class="art" style="background:var(--card)">${pyr("var(--bei)","var(--ter)")}</div><h3 style="margin-top:10px">${c.n}</h3><p class="pr">${c.d} · ${ps.length} məhsul</p></a>`}).join("")}</div></section>`,
product:id=>{const p=P(id);if(!p)return `<section class="wrap"><h2>Məhsul tapılmadı</h2><a class="btn" href="#shop">Mağazaya qayıt</a></section>`;
 const s=sel[id]||(sel[id]={size:null,color:p.colors[0][0],q:1}),cc=p.colors.find(c=>c[0]===s.color)[1];
 return `<section class="wrap two"><div>${art(p,cc)}</div><div><span class="eb">${p.cat}</span><h2 style="margin:8px 0">${esc(p.n)}</h2><p class="pr" style="font-size:1.1rem">${money(p)}</p><p style="margin:16px 0">Təsvir və material məlumatı brend tərəfindən əlavə olunmalıdır.</p>
<p class="eb">Rəng: ${s.color}</p><div class="chips" role="group" aria-label="Rəng">${p.colors.map(c=>`<button class="sw" data-act="pcol" data-id="${id}" data-v="${c[0]}" style="background:${c[1]}" aria-label="${c[0]}" aria-pressed="${s.color===c[0]}"></button>`).join("")}</div>
<p class="eb">Ölçü</p><div class="chips" role="group" aria-label="Ölçü">${p.sizes.map(z=>`<button class="chip" data-act="psz" data-id="${id}" data-v="${z}" aria-pressed="${s.size===z}">${z}</button>`).join("")}</div><p><a href="#size">Ölçü cədvəli</a></p><br>
<div class="q" style="display:flex;gap:12px;align-items:center"><button data-act="pq" data-id="${id}" data-v="-1" aria-label="Azalt">−</button><span aria-live="polite">${s.q}</span><button data-act="pq" data-id="${id}" data-v="1" aria-label="Artır">+</button></div><br>
<button class="btn mag" data-act="add" data-id="${id}">Səbətə at</button> <button class="btn o" data-act="fav" data-id="${id}" aria-pressed="${wish.includes(id)}">${wish.includes(id)?"♥ Sevimlidir":"♡ Sevimlilərə"}</button>
<p class="note">Stok və çatdırılma məlumatı sifariş təsdiqi zamanı brend tərəfindən bildirilir.</p></div></section>
<section class="wrap"><h2 style="margin-bottom:20px">Bənzər</h2><div class="grid">${DATA.products.filter(x=>x.id!==id).slice(0,4).map(cardW).join("")}</div></section>`},
lookbook:()=>`<section class="wrap"><h2>Lookbook</h2><p class="note">Real foto çəkilişi əlavə olunana qədər vizual yer tutucudur.</p><div class="grid g3">${DATA.products.map((p,i)=>`<div class="rv" style="${i%2?"margin-top:40px":""}">${art(p)}<p class="pr">Look ${String(i+1).padStart(2,"0")}</p></div>`).join("")}</div></section>`,
about:()=>`<section class="wrap two"><div class="rv"><span class="eb">Haqqımızda</span><h2>Bir piramida, bir ideya.</h2></div><div class="rv"><p>PIRAMIDA.WEAR həndəsi forma, sakit rənglər və küçə geyiminin birləşməsidir. Brendin real hekayəsi, əsaslandırıcı və komandası bu bölməyə əlavə olunmalıdır.</p><br><a class="btn" href="#contact">Əlaqə</a></div></section>`,
size:()=>`<section class="wrap"><h2>Ölçü cədvəli</h2><p class="note">Real ölçülər brend tərəfindən təsdiqlənməlidir. Aşağıdakı cədvəl boş şablondur.</p><div style="overflow-x:auto"><table><tr><th>Ölçü</th><th>Sinə (sm)</th><th>Uzunluq (sm)</th><th>Çiyin (sm)</th></tr>${["S","M","L","XL"].map(z=>`<tr><td>${z}</td><td>—</td><td>—</td><td>—</td></tr>`).join("")}</table></div></section>`,
shipping:()=>`<section class="wrap"><h2>Çatdırılma və Qaytarma</h2><p class="note">Çatdırılma müddəti, qiyməti və qaytarma şərtləri brend tərəfindən təsdiqlənib bura əlavə olunmalıdır. Hələlik hər sifariş WhatsApp və ya Instagram vasitəsilə fərdi razılaşdırılır.</p><h3>Çatdırılma</h3><p>Məlumat əlavə olunacaq.</p><br><h3>Qaytarma və dəyişdirmə</h3><p>Məlumat əlavə olunacaq.</p><br><h3>Ödəniş</h3><p>Saytda onlayn ödəniş yoxdur. Ödəniş üsulu sifariş təsdiqi zamanı razılaşdırılır.</p></section>`,
contact:()=>`<section class="wrap two"><div><h2>Əlaqə</h2><p style="margin:16px 0">Sualınız və ya sifarişiniz üçün yazın.</p>${CONFIG.INSTAGRAM?`<a class="btn mag" target="_blank" rel="noopener" href="https://ig.me/m/${CONFIG.INSTAGRAM}">Instagram DM</a> `:""}${CONFIG.WHATSAPP?`<a class="btn o mag" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.WHATSAPP}">WhatsApp</a>`:'<p class="note">WhatsApp nömrəsi hələ təyin olunmayıb (CONFIG.WHATSAPP).</p>'}</div>
<form id="cf"><label for="cn">Ad</label><input id="cn" required><label for="cm">Mesaj</label><textarea id="cm" rows="4" required></textarea><button class="btn" data-act="cmsg" type="submit">Göndər</button></form></section>`,
cart:()=>{const t=totals();return `<section class="wrap"><h2>Səbət</h2>${cart.length?`<div class="two"><div>${cartRows()}<p style="margin-top:14px"><strong>Cəmi: ${t}</strong></p></div>
<form id="of"><label for="on">Ad, soyad</label><input id="on" required autocomplete="name"><label for="op">Telefon</label><input id="op" type="tel" required autocomplete="tel"><label for="oa">Ünvan</label><textarea id="oa" rows="2" required autocomplete="street-address"></textarea><label for="oc">Göndərmə kanalı</label><select id="oc"><option value="ig">Instagram DM</option>${CONFIG.WHATSAPP?'<option value="wa">WhatsApp</option>':""}</select><label for="ot">Qeyd</label><textarea id="ot" rows="2"></textarea><button class="btn mag" type="submit">Sifarişi göndər</button><p class="note">Bu, sifariş sorğusudur; ödəniş və təsdiq mesajlaşma ilə razılaşdırılır.</p></form></div>`:`<p style="margin:16px 0">Səbətiniz boşdur.</p><a class="btn" href="#shop">Alış-verişə başla</a>`}</section>`}
};
const totals=()=>{let t=0,u=false;cart.forEach(i=>{const p=P(i.id);p.price==null?u=true:t+=p.price*i.q});return u?(t?t.toFixed(2)+" "+CONFIG.CURRENCY+" + qiyməti sorğulu məhsullar":"Qiymət sorğu ilə"):t.toFixed(2)+" "+CONFIG.CURRENCY};
const cartRows=()=>cart.map((i,x)=>{const p=P(i.id),c=p.colors.find(c=>c[0]===i.color);return `<div class="li">${art(p,c&&c[1])}<div style="flex:1"><a href="#product-${p.id}">${esc(p.n)}</a><div class="pr">${i.color} · ${i.size} · ${money(p)}</div><div class="q"><button data-act="cq" data-i="${x}" data-v="-1" aria-label="Azalt">−</button> ${i.q} <button data-act="cq" data-i="${x}" data-v="1" aria-label="Artır">+</button></div></div><button class="ib" data-act="rm" data-i="${x}" aria-label="Sil">✕</button></div>`}).join("");
function drawer(){$("#drw").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h3>Səbət</h3><button class="ib" data-act="close">BAĞLA</button></div><div style="flex:1;overflow:auto">${cart.length?cartRows():"<p style='margin:20px 0'>Səbət boşdur.</p>"}</div><p><strong>Cəmi: ${totals()}</strong></p><br><a class="btn" href="#cart" data-act="close" style="text-align:center">Sifarişə keç</a>`}
function plist(){const q=F.q.trim().toLowerCase(),l=DATA.products.filter(p=>(!q||(p.n+p.cat).toLowerCase().includes(q))&&(F.cat==="Hamısı"||p.cat===F.cat)&&(F.color==="Hamısı"||p.colors.some(c=>c[0]===F.color))&&(!F.wo||wish.includes(p.id)));
 $("#pl").innerHTML=l.map(cardW).join("");$("#cnt").textContent=l.length?l.length+" məhsul":"Heç nə tapılmadı.";reveal()}
/* ============ ROUTER + KEÇİD ============ */
let cur="";
function route(first){const h=location.hash.slice(1)||"home";if(h===cur&&!first)return;cur=h;
 const go=()=>{const[m,id]=[h.split("-")[0],h.slice(h.indexOf("-")+1)];const r=tpl[m]?m:"home";
  $("#main").innerHTML=m==="product"?tpl.product(id):tpl[r]();chrome(m==="product"?"shop":r);
  const T={home:"Ana səhifə",shop:"Mağaza",collections:"Kolleksiyalar",lookbook:"Lookbook",about:"Haqqımızda",size:"Ölçü cədvəli",shipping:"Çatdırılma və Qaytarma",contact:"Əlaqə",cart:"Səbət",product:m==="product"&&P(id)?P(id).n:"Məhsul"};
  document.title=(T[r]||"")+" — PIRAMIDA.WEAR";scrollTo(0,0);if(r==="shop")plist();bindPage();reveal();$("#main").focus({preventScroll:true});close()};
 if(first||RM)return go();const c=$("#curt");c.className="in";setTimeout(()=>{go();c.className="out";setTimeout(()=>c.className="",480)},360)}
addEventListener("hashchange",()=>route());
function reveal(){const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.1});$$(".rv:not(.in)").forEach(el=>RM?el.classList.add("in"):io.observe(el))}
function bindPage(){const q=$("#q");q&&q.addEventListener("input",e=>{F.q=e.target.value;plist()});
 const of=$("#of");of&&of.addEventListener("submit",e=>{e.preventDefault();order()});
 const cf=$("#cf");cf&&cf.addEventListener("submit",e=>{e.preventDefault();send("Ad: "+$("#cn").value+"\nMesaj: "+$("#cm").value,CONFIG.WHATSAPP?"wa":"ig")})}
/* ============ SİFARİŞ (WhatsApp / Instagram) ============ */
function send(text,ch){if(ch==="wa"&&CONFIG.WHATSAPP){open(`https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(text)}`,"_blank","noopener");return}
 (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast("Mətn kopyalandı — Instagram DM-də yapışdırın"),()=>toast("Mətni əl ilə kopyalayın"));
 open(`https://ig.me/m/${CONFIG.INSTAGRAM}`,"_blank","noopener")}
function order(){const l=cart.map((i,x)=>`${x+1}. ${P(i.id).n} — ${i.color}, ${i.size}, ${i.q} ədəd (${money(P(i.id))})`).join("\n");
 send(`Salam! Sifariş sorğusu (${CONFIG.BRAND}):\n${l}\nCəmi: ${totals()}\n\nAd: ${$("#on").value}\nTelefon: ${$("#op").value}\nÜnvan: ${$("#oa").value}\nQeyd: ${$("#ot").value||"—"}`,$("#oc").value)}
/* ============ HADİSƏLƏR ============ */
function upd(){sv("pw_cart",cart);sv("pw_wish",wish);chrome(location.hash.slice(1).split("-")[0]);if($("#drw").classList.contains("on"))drawer()}
function close(){["menu","drw","ov"].forEach(i=>$("#"+i).classList.remove("on"));$("#menub").setAttribute("aria-expanded","false");document.body.style.overflow=""}
function openD(id){close();$("#"+id).classList.add("on");if(id==="drw"){drawer();$("#ov").classList.add("on");$("#drw button").focus()}document.body.style.overflow="hidden"}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
 const rr=()=>{const h=location.hash.slice(1);cur="";route(true)};
 if(a==="menu"){const on=$("#menu").classList.contains("on");close();if(!on){$("#menu").classList.add("on");$("#menub").setAttribute("aria-expanded","true");document.body.style.overflow="hidden"}}
 else if(a==="close")close();else if(a==="drawer")openD("drw");
 else if(a==="wish"){F={q:"",cat:"Hamısı",color:"Hamısı",wo:true};location.hash==="#shop"?rr():location.hash="shop"}
 else if(a==="fav"){wish=wish.includes(id)?wish.filter(x=>x!==id):[...wish,id];upd();toast(wish.includes(id)?"Sevimlilərə əlavə olundu":"Sevimlilərdən silindi");
  if(b.classList.contains("wl")){const on=wish.includes(id);$$(`.wl[data-id="${id}"]`).forEach(x=>{x.setAttribute("aria-pressed",on);x.textContent=on?"♥":"♡"});if(F.wo)plist()}else rr()}
 else if(a==="fcat"){F.cat=v;rr()}else if(a==="fcol"){F.color=v;rr()}else if(a==="fwl"){F.wo=!F.wo;rr()}
 else if(a==="setcol"){F={q:"",cat:"Hamısı",color:"Hamısı",wo:false}}
 else if(a==="pcol"){sel[id].color=v;rr()}else if(a==="psz"){sel[id].size=v;rr()}
 else if(a==="pq"){sel[id].q=Math.max(1,Math.min(10,sel[id].q+ +v));rr()}
 else if(a==="add"){const s=sel[id];if(!s.size){toast("Zəhmət olmasa ölçü seçin");return}
  const ex=cart.find(i=>i.id===id&&i.size===s.size&&i.color===s.color);ex?ex.q+=s.q:cart.push({id,size:s.size,color:s.color,q:s.q});upd();openD("drw")}
 else if(a==="cq"){const i=cart[+b.dataset.i];i.q=Math.max(1,Math.min(10,i.q+ +v));upd();if(location.hash==="#cart")rr()}
 else if(a==="rm"){cart.splice(+b.dataset.i,1);upd();if(location.hash==="#cart")rr()}
 else if(a==="cmsg"){}
 });
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
/* maqnit düymələr + parallaks (yalnız incə göstərici və az hərəkət tələb olunmayanda) */
if(!RM&&matchMedia("(pointer:fine)").matches){document.addEventListener("pointermove",e=>{const m=e.target.closest(".mag");$$(".mag").forEach(x=>{if(x!==m)x.style.transform=""});if(m){const r=m.getBoundingClientRect();m.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25}px,${(e.clientY-r.top-r.height/2)*.25}px)`}})}
if(!RM)addEventListener("scroll",()=>{const p=$("[data-par]");if(p)p.style.transform=`translateY(${scrollY*.12}px) rotate(${scrollY*.01}deg)`},{passive:true});
route(true);
</script></body></html>
